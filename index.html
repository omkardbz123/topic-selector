<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climate Action Change Club</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --border: #d1d5db;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body {
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* --- MAIN CONTAINER --- */
    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    h2 { 
      text-align: center; 
      margin-bottom: 0.5rem; 
      color: var(--primary);
      font-size: 1.5rem;
    }
    
    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    /* --- SCREEN 1: SELECTION BUTTONS --- */
    #selectionScreen {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .choice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 1.5rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .choice-btn:hover {
      border-color: var(--primary);
      background-color: #eef2ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .choice-icon { font-size: 2rem; }
    .choice-text { font-size: 1.2rem; font-weight: 600; color: var(--text); }

    /* --- SCREEN 2: FORM --- */
    #formScreen { display: none; } /* Hidden initially */

    .back-btn {
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .back-btn:hover { color: var(--text); text-decoration: underline; }

    .section-title {
      background: #f3f4f6;
      padding: 10px;
      margin: 20px 0 15px 0;
      border-radius: 6px;
      font-weight: bold;
      color: var(--primary);
      border-left: 4px solid var(--primary);
    }

    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; color: #374151; }
    
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: background 0.2s;
    }
    
    .submit-btn:hover { background-color: var(--primary-hover); }
    .submit-btn:disabled { background-color: #9ca3af; cursor: not-allowed; }

    #status {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 6px;
      text-align: center;
      display: none;
      font-weight: 500;
    }
    .success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Climate Action Change Club</h2>
    <div class="subtitle">Inauguration Topic Selection</div>

    <div id="selectionScreen">
      <p style="text-align: center; margin-bottom: 1rem;">How would you like to participate?</p>
      
      <div class="choice-btn" onclick="selectType('Solo')">
        <span class="choice-icon">👤</span>
        <span class="choice-text">Solo Project</span>
      </div>
      
      <div class="choice-btn" onclick="selectType('Group')">
        <span class="choice-icon">👥</span>
        <span class="choice-text">Group Project</span>
      </div>
    </div>

    <form id="assignmentForm" id="formScreen" class="hidden">
      <button type="button" class="back-btn" onclick="goBack()">← Back to selection</button>
      
      <input type="hidden" id="projectType">

      <div class="form-group">
        <label>Choose Topic</label>
        <select id="topic" required>
          <option value="">Loading topics...</option>
        </select>
      </div>

      <div class="section-title">Student 1 Details</div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="s1_name" placeholder="Ex: Rahul Sharma" required>
      </div>
      <div class="row">
        <div class="col">
          <label>Class (FY/SY/TY)</label>
          <input type="text" id="s1_class" placeholder="Ex: FYBSc" required>
        </div>
        <div class="col">
          <label>Div</label>
          <input type="text" id="s1_div" placeholder="Ex: K1" required>
        </div>
      </div>
      <div class="form-group">
        <label>Roll No</label>
        <input type="text" id="s1_roll" placeholder="Ex: TE101" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="s1_email" placeholder="student1@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="s1_phone" placeholder="9876543210" required>
      </div>

      <div id="student2Section" class="hidden">
        <div class="section-title">Student 2 Details</div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="s2_name" placeholder="Ex: Anjali Gupta">
        </div>
        <div class="row">
          <div class="col">
            <label>Class (FY/SY/TY)</label>
            <input type="text" id="s2_class" placeholder="Ex: FYBSc">
          </div>
          <div class="col">
            <label>Div</label>
            <input type="text" id="s2_div" placeholder="Ex: E2">
          </div>
        </div>
        <div class="form-group">
          <label>Roll No</label>
          <input type="text" id="s2_roll" placeholder="Ex: FE102">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="s2_email" placeholder="student2@gmail.com">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="s2_phone" placeholder="9876543210">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Confirm Topic</button>
    </form>

    <div id="status"></div>
  </div>

<script>
  // --- EXISTING WEB APP URL ---
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZvEr7rldiVifxOWXiNOdoLnz2jIm4TvQnh3mVq8PpyWvmJmJQ0iU4jmOjed8qQU9MmQ/exec"; 

  const selectionScreen = document.getElementById("selectionScreen");
  const formScreen = document.getElementById("assignmentForm");
  const s2Section = document.getElementById("student2Section");
  const projectTypeInput = document.getElementById("projectType");
  const topicSelect = document.getElementById("topic");
  const statusDiv = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  // 1. Fetch Topics on Load
  window.onload = function() {
    fetch(SCRIPT_URL)
      .then(r => r.json())
      .then(data => {
        topicSelect.innerHTML = '<option value="">-- Select a Topic --</option>';
        if (data.status === "success") {
          data.data.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t.name;
            if (t.taken) {
              opt.text = "❌ [TAKEN] " + t.name;
              opt.disabled = true;
            } else {
              opt.text = "✅ " + t.name;
            }
            topicSelect.appendChild(opt);
          });
        }
      })
      .catch(e => {
        console.error(e);
        topicSelect.innerHTML = '<option>Error loading topics</option>';
      });
  };

  // 2. Handle Selection (Solo vs Group)
  function selectType(type) {
    projectTypeInput.value = type;
    selectionScreen.style.display = "none";
    formScreen.style.display = "block";
    formScreen.classList.remove("hidden");

    const s2Inputs = s2Section.querySelectorAll("input");

    if (type === "Group") {
      s2Section.classList.remove("hidden");
      s2Inputs.forEach(input => input.setAttribute("required", "true"));
    } else {
      s2Section.classList.add("hidden");
      s2Inputs.forEach(input => input.removeAttribute("required"));
      s2Inputs.forEach(input => input.value = ""); 
    }
  }

  // 3. Handle Back Button
  function goBack() {
    formScreen.style.display = "none";
    selectionScreen.style.display = "flex";
    statusDiv.style.display = "none";
  }

  // 4. Submit Form
  formScreen.addEventListener("submit", function(e) {
    e.preventDefault();
    statusDiv.style.display = "none";

    // --- NEW VALIDATION LOGIC ---

    // Regex for Class: Checks if it starts with FY, SY, or TY (Case Insensitive)
    const classRegex = /^(FY|SY|TY)/i;
    // Regex for Phone: Checks for exactly 10 digits
    const phoneRegex = /^[0-9]{10}$/;

    // Student 1 Validation
    const s1Class = document.getElementById("s1_class").value.toUpperCase();
    const s1Phone = document.getElementById("s1_phone").value.trim();

    if (!classRegex.test(s1Class)) {
      showError("Student 1: Class must start with FY, SY, or TY (e.g., FYBSc).");
      return;
    }
    if (!phoneRegex.test(s1Phone)) {
      showError("Student 1: Please enter a valid 10-digit phone number.");
      return;
    }

    // Student 2 Validation (if Group)
    if (projectTypeInput.value === "Group") {
      const s2Class = document.getElementById("s2_class").value.toUpperCase();
      const s2Phone = document.getElementById("s2_phone").value.trim();

      if (!classRegex.test(s2Class)) {
        showError("Student 2: Class must start with FY, SY, or TY (e.g., FYBSc).");
        return;
      }
      if (!phoneRegex.test(s2Phone)) {
        showError("Student 2: Please enter a valid 10-digit phone number.");
        return;
      }
    }
    // ---------------------------

    // Submit Animation
    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ Processing...";

    const formData = {
      type: projectTypeInput.value,
      topic: topicSelect.value,
      s1_name: document.getElementById("s1_name").value,
      s1_class: document.getElementById("s1_class").value,
      s1_div: document.getElementById("s1_div").value,
      s1_roll: document.getElementById("s1_roll").value,
      s1_email: document.getElementById("s1_email").value,
      s1_phone: document.getElementById("s1_phone").value,
      s2_name: document.getElementById("s2_name").value,
      s2_class: document.getElementById("s2_class").value,
      s2_div: document.getElementById("s2_div").value,
      s2_roll: document.getElementById("s2_roll").value,
      s2_email: document.getElementById("s2_email").value,
      s2_phone: document.getElementById("s2_phone").value,
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(formData)
    })
    .then(r => r.json())
    .then(resp => {
      statusDiv.style.display = "block";
      if (resp.status === "success") {
        statusDiv.className = "success";
        statusDiv.innerText = "🎉 " + resp.message;
        formScreen.reset();
        setTimeout(() => location.reload(), 3000);
      } else {
        statusDiv.className = "error";
        statusDiv.innerText = "⚠️ " + resp.message;
        submitBtn.disabled = false;
        submitBtn.innerText = "Confirm Topic";
      }
    })
    .catch(err => {
      showError("Network Error. Check internet connection.");
      submitBtn.disabled = false;
      submitBtn.innerText = "Confirm Topic";
    });
  });

  function showError(msg) {
    statusDiv.style.display = "block";
    statusDiv.className = "error";
    statusDiv.innerText = "⚠️ " + msg;
  }
</script>

</body>
</html>
