<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Topic Assignment</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --border: #d1d5db;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    
    body {
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    h2 { text-align: center; margin-bottom: 1.5rem; color: var(--text); }
    
    /* Type Selection (Radio) */
    .type-selection {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 1.5rem;
      background: #eef2ff;
      padding: 10px;
      border-radius: 8px;
    }

    .radio-label {
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .section-title {
      background: #e5e7eb;
      padding: 8px;
      margin: 15px 0 10px 0;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
    
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:disabled { background-color: #9ca3af; }

    #status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    .success { background-color: #d1fae5; color: #065f46; }
    .error { background-color: #fee2e2; color: #991b1b; }
    
    /* Helper to hide Student 2 */
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>📝 Topic Assignment</h2>

  <form id="assignmentForm">
    
    <div class="type-selection">
      <label class="radio-label">
        <input type="radio" name="projectType" value="Solo" checked onchange="toggleForm()"> Solo Project
      </label>
      <label class="radio-label">
        <input type="radio" name="projectType" value="Group" onchange="toggleForm()"> Group Project
      </label>
    </div>

    <div class="form-group">
      <label>Choose Topic</label>
      <select id="topic" required>
        <option value="">Loading topics...</option>
      </select>
    </div>

    <div class="section-title">Student 1 Details</div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="s1_name" placeholder="Ex: Rahul Sharma" required>
    </div>
    <div class="row">
      <div class="col">
        <label>Class (Start with FY)</label>
        <input type="text" id="s1_class" placeholder="Ex: FYBSc" required>
      </div>
      <div class="col">
        <label>Div</label>
        <input type="text" id="s1_div" placeholder="Ex: I1" required>
      </div>
    </div>
    <div class="form-group">
      <label>Roll No</label>
      <input type="text" id="s1_roll" placeholder="Ex: FE3301" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="s1_email" placeholder="student1@gmail.com" required>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="tel" id="s1_phone" placeholder="9876543210" required>
    </div>

    <div id="student2Section" class="hidden">
      <div class="section-title">Student 2 Details</div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="s2_name" placeholder="Ex: Anjali Gupta">
      </div>
      <div class="row">
        <div class="col">
          <label>Class (Start with FY)</label>
          <input type="text" id="s2_class" placeholder="Ex: FYBSc">
        </div>
        <div class="col">
          <label>Div</label>
          <input type="text" id="s2_div" placeholder="Ex: E2">
        </div>
      </div>
      <div class="form-group">
        <label>Roll No</label>
        <input type="text" id="s2_roll" placeholder="Ex: SE1102">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="s2_email" placeholder="student2@gmail.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="s2_phone" placeholder="9876543210">
      </div>
    </div>

    <button type="submit" id="submitBtn">Confirm Selection</button>
  </form>

  <div id="status"></div>
</div>

<script>
  // --- PASTE YOUR DEPLOYED WEB APP URL HERE ---
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZvEr7rldiVifxOWXiNOdoLnz2jIm4TvQnh3mVq8PpyWvmJmJQ0iU4jmOjed8qQU9MmQ/exec"; 

  const topicSelect = document.getElementById("topic");
  const form = document.getElementById("assignmentForm");
  const s2Section = document.getElementById("student2Section");
  const statusDiv = document.getElementById("status");
  const btn = document.getElementById("submitBtn");

  // Load Topics
  window.onload = function() {
    fetch(SCRIPT_URL)
      .then(r => r.json())
      .then(data => {
        topicSelect.innerHTML = '<option value="">-- Select a Topic --</option>';
        if (data.status === "success") {
          data.data.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t.name;
            if (t.taken) {
              opt.text = "❌ [TAKEN] " + t.name;
              opt.disabled = true;
            } else {
              opt.text = "✅ " + t.name;
            }
            topicSelect.appendChild(opt);
          });
        }
      });
  };

  // Toggle Group/Solo
  function toggleForm() {
    const isGroup = document.querySelector('input[name="projectType"]:checked').value === "Group";
    const s2Inputs = s2Section.querySelectorAll("input");

    if (isGroup) {
      s2Section.classList.remove("hidden");
      // Make Student 2 fields required
      s2Inputs.forEach(input => input.setAttribute("required", "true"));
    } else {
      s2Section.classList.add("hidden");
      // Remove required from Student 2 fields so form can submit
      s2Inputs.forEach(input => input.removeAttribute("required"));
      // Clear values if switching back to solo
      s2Inputs.forEach(input => input.value = "");
    }
  }

  // Handle Submit
  form.addEventListener("submit", function(e) {
    e.preventDefault();
    statusDiv.style.display = "none";
    
    // 1. Validation for "FY" (First Year)
    const s1Class = document.getElementById("s1_class").value.toUpperCase();
    if (!s1Class.startsWith("FY")) {
      showError("Student 1: Only FY (First Year) students allowed.");
      return;
    }

    const type = document.querySelector('input[name="projectType"]:checked').value;
    
    if (type === "Group") {
      const s2Class = document.getElementById("s2_class").value.toUpperCase();
      if (!s2Class.startsWith("FY")) {
        showError("Student 2: Only FY (First Year) students allowed.");
        return;
      }
    }

    // 2. Prepare Data
    btn.disabled = true;
    btn.innerText = "Processing...";

    const formData = {
      type: type,
      topic: topicSelect.value,
      // Student 1
      s1_name: document.getElementById("s1_name").value,
      s1_class: document.getElementById("s1_class").value,
      s1_div: document.getElementById("s1_div").value,
      s1_roll: document.getElementById("s1_roll").value,
      s1_email: document.getElementById("s1_email").value,
      s1_phone: document.getElementById("s1_phone").value,
      // Student 2 (will be empty strings if Solo)
      s2_name: document.getElementById("s2_name").value,
      s2_class: document.getElementById("s2_class").value,
      s2_div: document.getElementById("s2_div").value,
      s2_roll: document.getElementById("s2_roll").value,
      s2_email: document.getElementById("s2_email").value,
      s2_phone: document.getElementById("s2_phone").value,
    };

    // 3. Send to Google Sheet
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(formData)
    })
    .then(r => r.json())
    .then(resp => {
      statusDiv.style.display = "block";
      if (resp.status === "success") {
        statusDiv.className = "success";
        statusDiv.innerText = "🎉 " + resp.message;
        form.reset();
        setTimeout(() => location.reload(), 2000);
      } else {
        statusDiv.className = "error";
        statusDiv.innerText = "⚠️ " + resp.message;
      }
    })
    .catch(err => {
      statusDiv.style.display = "block";
      statusDiv.className = "error";
      statusDiv.innerText = "Network Error.";
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Confirm Selection";
    });
  });

  function showError(msg) {
    statusDiv.style.display = "block";
    statusDiv.className = "error";
    statusDiv.innerText = "⚠️ " + msg;
  }
</script>

</body>
</html>
